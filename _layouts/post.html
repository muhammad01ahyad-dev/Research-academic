---
layout: default
---
<article class="site-shell entry fade-in">
  <div class="entry-meta">{{ page.date | date: "%A, %d %B %Y" }} · Daily Log</div>
  <h1>{{ page.title }}</h1>
  {% if page.tags.size > 0 %}
  <div class="tags">
    {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
  </div>
  {% endif %}
  <div class="entry-body">
    {{ content }}
  </div>
</article>
